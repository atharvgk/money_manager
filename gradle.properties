org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Java's dual-stack (IPv6) sockets time out on some home networks when downloading from GitHub/Maven.
# Forcing IPv4 is harmless elsewhere. The wrapper also reads this "systemProp." line.
systemProp.java.net.preferIPv4Stack=true
